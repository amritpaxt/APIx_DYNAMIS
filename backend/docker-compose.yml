services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: apix
      POSTGRES_USER: apix
      POSTGRES_PASSWORD: apix_dev_only
    ports: ["5432:5432"]
    volumes: ["apix_db:/var/lib/postgresql/data"]
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APIX_DATABASE_URL: postgresql+psycopg://apix:apix_dev_only@db:5432/apix
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  apix_db:
